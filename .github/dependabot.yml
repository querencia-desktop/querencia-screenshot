# Nur die GitHub-Aktionen der CI (actions/checkout, actions/cache), monatlich.
# Keine cargo-Einträge (GH-7, 21.10.2026): Abhängigkeiten werden bewusst über
# Cargo.lock und die Programmversionen gehoben, nicht über wöchentliche PRs.
# Eine neue Hauptversion einer Aktion erst in vorlagen/.github/workflows/ci.yml
# prüfen (Container-Job ubuntu:26.04), dann in die Klone übernehmen.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
