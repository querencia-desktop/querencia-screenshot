[package]
name = "querencia-screenshot"
version = "0.1.0"
edition = "2024"
description = "Klassisches Screenshot-Werkzeug für Querencia Desktop (grim, slurp, wl-copy)"
license = "MIT"
publish = false

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
# Aktives Fenster für --window (wlr-foreign-toplevel-management, labwc)
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[profile.release]
lto = true
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "warn"
